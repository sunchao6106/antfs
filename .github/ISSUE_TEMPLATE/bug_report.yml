name: Bug Report
description: Report a reproducible problem in antfs
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error messages or logs.
      placeholder: Tell us what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or code that reproduce the problem.
      placeholder: |
        1. cargo run -p antfs-devcluster
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - blob (storage engine)
        - master (Raft control plane)
        - store (data node)
        - router (client SDK)
        - frontend (REST API)
        - admin (web console)
        - devcluster / tooling
        - other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: macOS 15 / Ubuntu 24.04
        Rust: rustc 1.xx.x
        Commit: abc1234
    validations:
      required: true
