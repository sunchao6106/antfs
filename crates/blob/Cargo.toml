[package]
name = "antfs-blob"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "1"
tracing = "0.1"
crc32fast = "1"
libc = "0.2"
xorf = "0.13.0"
memmap2 = "0.9"
crossbeam-skiplist = "0.1"
antfs-config = { path = "../common/config" }
antfs-metric = { path = "../common/metric" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
antfs-config = { path = "../common/config" }
antfs-metric = { path = "../common/metric" }
