[package]
name = "antfs-router"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# 纯库(无二进制):它是 router —— 客户端侧通用组件,被 crates/frontend 与 benchmark/router 依赖。

[dependencies]
antfs-blob = { path = "../../blob" }
antfs-master = { path = "../../master" }
antfs-config = { path = "../config" }
antfs-descriptor = { path = "../descriptor" }
antfs-metric = { path = "../metric" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "io-util"] }
tonic = "0.14"
# 与 store 同款:数据面是裸 HTTP(D2),本地/内网不需要 TLS,故 default-features=false。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
bytes = "1"
# 恒切失败回收的孤儿墓碑日志(结构化字段)。
tracing = "0.1"
hex = "0.4"
futures = "0.3"

[dev-dependencies]
antfs-store = { path = "../../store" }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tempfile = "3"
serde_json = "1"
