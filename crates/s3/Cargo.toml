[package]
name = "antfs-s3"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "antfs-s3"
path = "src/main.rs"

[dependencies]
antfs-router = { path = "../common/router" }
antfs-config = { path = "../common/config" }
antfs-metric = { path = "../common/metric" }
antfs-blob = { path = "../blob" }
axum = "0.8"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util", "time"] }
bytes = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "migrate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
md-5 = "0.10"

[dev-dependencies]
antfs-master = { path = "../master" }
antfs-store = { path = "../store" }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
