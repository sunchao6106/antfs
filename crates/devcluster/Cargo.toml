[package]
name = "antfs-devcluster"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "antfs-devcluster"
path = "src/main.rs"

[dependencies]
antfs-master = { path = "../master" }
antfs-store = { path = "../store" }
antfs-admin = { path = "../admin" }
antfs-frontend = { path = "../frontend" }
antfs-s3 = { path = "../s3" }
antfs-router = { path = "../common/router" }
antfs-bench-router = { path = "../../benchmark/router" }
antfs-bench-frontend = { path = "../../benchmark/frontend" }
antfs-blob = { path = "../blob" }
antfs-config = { path = "../common/config" }
antfs-metric = { path = "../common/metric" }
serde = { version = "1", features = ["derive"] }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tonic = "0.14"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
