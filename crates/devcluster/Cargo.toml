[package]
name = "devcluster"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "devcluster"
path = "src/main.rs"

[dependencies]
master = { path = "../master" }
store = { path = "../store" }
admin = { path = "../admin" }
blob = { path = "../blob" }
config = { path = "../common/config" }
metric = { path = "../common/metric" }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
