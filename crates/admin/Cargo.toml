[package]
name = "antfs-admin"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "antfs-admin"
path = "src/main.rs"

[dependencies]
antfs-master = { path = "../master" }
antfs-config = { path = "../common/config" }
antfs-metric = { path = "../common/metric" }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tonic = "0.14"
axum = "0.8"
async-trait = "0.1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
# 账号密码登录的 SQL 后端(`admin-auth-db`):驱动形态对齐 s3.metastore。
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "migrate"] }
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
