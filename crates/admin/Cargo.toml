[package]
name = "admin"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "admin"
path = "src/main.rs"

[dependencies]
master = { path = "../master" }
config = { path = "../common/config" }
metric = { path = "../common/metric" }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tonic = "0.14"
axum = "0.8"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
