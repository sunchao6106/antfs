[package]
name = "antfs-frontend"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "antfs-frontend"
path = "src/main.rs"

[dependencies]
antfs-router = { path = "../common/router" }
antfs-config = { path = "../common/config" }
antfs-metric = { path = "../common/metric" }
antfs-blob = { path = "../blob" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util", "time"] }
bytes = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"

[dev-dependencies]
antfs-master = { path = "../master" }
antfs-store = { path = "../store" }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tempfile = "3"
# 测试用真 HTTP 客户端打 frontend;dev 侧只需 json(裸 socket 用例直接用 tokio::net)。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
