[package]
name = "antfs-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "antfs-store"
path = "src/main.rs"

[dependencies]
antfs-blob = { path = "../blob" }
antfs-master = { path = "../master" }
antfs-config = { path = "../common/config" }
antfs-metric = { path = "../common/metric" }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal", "fs", "io-util"] }
tokio-stream = "0.1"
tonic = "0.14"
axum = "0.8"
bytes = "1"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
